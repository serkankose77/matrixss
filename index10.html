<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0a10">
<title>Liquid Plasma — serkankose77.me</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..700;1,9..144,200..700&amp;family=Spline+Sans+Mono:wght@300..500&amp;display=swap">
<style>
:root{
  --bg:#0d0a10;
  --ink:#f5ede4;
  --ember:#ed5223;
  --rose:#f95d78;
  --violet:#7b5cff;
  --gold:#ffd9a0;
  --frame:rgba(245,237,228,.17);
  --inset:clamp(12px,2.2vw,30px);
  --pad:calc(var(--inset) + clamp(14px,1.6vw,22px));
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  cursor:crosshair;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
}

/* ---------- scene ---------- */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* CSS fallback lava (shown only when WebGL is unavailable) */
.fallback{position:fixed;inset:0;display:none;overflow:hidden;
  background:radial-gradient(130% 105% at 50% 118%,#33101f 0%,#170c16 55%,#0d0a10 100%)}
html.no-gl .fallback{display:block}
html.no-gl #gl{display:none}
.blob{position:absolute;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;will-change:transform}
.b1{width:58vmax;height:58vmax;left:-12vmax;top:16vmax;opacity:.8;
  background:radial-gradient(circle at 42% 40%,rgba(237,82,35,.8),rgba(237,82,35,0) 62%);
  animation:drift1 27s ease-in-out infinite alternate}
.b2{width:48vmax;height:48vmax;right:-10vmax;top:-8vmax;opacity:.6;
  background:radial-gradient(circle at 55% 50%,rgba(249,93,120,.7),rgba(249,93,120,0) 62%);
  animation:drift2 33s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;left:22vmax;bottom:-16vmax;opacity:.45;
  background:radial-gradient(circle at 50% 42%,rgba(123,92,255,.65),rgba(123,92,255,0) 60%);
  animation:drift3 39s ease-in-out infinite alternate}
.b4{width:26vmax;height:26vmax;left:38vw;top:30vh;opacity:.5;
  background:radial-gradient(circle at 50% 50%,rgba(255,217,160,.55),rgba(255,217,160,0) 58%);
  animation:drift4 21s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(20vmax,-16vmax,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-16vmax,14vmax,0) scale(.92)}}
@keyframes drift3{to{transform:translate3d(10vmax,-18vmax,0) scale(1.12)}}
@keyframes drift4{to{transform:translate3d(-14vmax,10vmax,0) scale(1.3)}}

/* ---------- atmosphere ---------- */
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 45%,transparent 52%,rgba(5,3,8,.55) 100%)}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
  background-size:160px 160px}
.frame{position:fixed;inset:var(--inset);z-index:4;pointer-events:none;
  border:1px solid var(--frame);mix-blend-mode:difference;
  opacity:0;animation:fadeIn 2.2s ease 2.4s forwards}

/* ---------- identity ---------- */
.stage{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:0 6vw;pointer-events:none}
h1{
  margin:0;font-family:var(--serif);font-weight:500;font-style:normal;
  font-size:clamp(2.3rem,7.6vw,8.6rem);
  letter-spacing:-.015em;line-height:1.04;
  color:#fff;mix-blend-mode:difference;
  font-variation-settings:'opsz' 144;
}
h1 .ch{display:inline-block;opacity:0;transform:translateY(.45em) scale(.96);
  filter:blur(16px);animation:charIn 1.35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes charIn{
  0%{opacity:0;transform:translateY(.45em) scale(.96);filter:blur(16px)}
  60%{opacity:1;filter:blur(3px)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.caption{
  margin-top:clamp(.7rem,1.8vw,1.5rem);
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(.95rem,1.45vw,1.4rem);letter-spacing:.05em;
  color:#fff;mix-blend-mode:difference;opacity:0;
  animation:rise 1.7s cubic-bezier(.22,1,.36,1) 1.75s forwards;
}

/* ---------- plates ---------- */
.plate{position:fixed;z-index:6;color:#fff;mix-blend-mode:difference;
  font-family:var(--mono);font-weight:300;
  font-size:clamp(.58rem,.85vw,.73rem);line-height:1.75;
  letter-spacing:.24em;text-transform:uppercase;
  opacity:0;animation:rise 1.5s cubic-bezier(.22,1,.36,1) forwards}
.plate em{font-style:normal;opacity:.62}
.tl{left:var(--pad);top:var(--pad);animation-delay:2.05s}
.tr{right:var(--pad);top:var(--pad);text-align:right;animation-delay:2.2s}
.bl{left:var(--pad);bottom:var(--pad);animation-delay:2.35s}
.br{right:var(--pad);bottom:var(--pad);text-align:right;animation-delay:2.5s}
#hms{font-size:clamp(1.15rem,2.1vw,1.7rem);line-height:1.15;
  letter-spacing:.14em;font-variant-numeric:tabular-nums;font-weight:300}
#date{margin-top:.3rem;opacity:.72}
.hint{margin-top:.15rem;opacity:.5;letter-spacing:.18em}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media (max-width:600px){
  .tr,.br{display:none}
  .plate{letter-spacing:.18em}
}
@media (prefers-reduced-motion:reduce){
  .plate,.caption,.frame,h1 .ch{animation:none;opacity:1;transform:none;filter:none}
  .blob{animation:none}
}
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>

<div class="fallback" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"></div>

<main class="stage">
  <h1 id="title">serkankose77.me</h1>
  <p class="caption">a homelab, gently melting</p>
</main>

<div class="plate tl">
  <div>N&deg; 10 / 12</div>
  <div><em>liquid plasma</em></div>
</div>
<div class="plate tr">
  <div>raw webgl &middot; no libraries</div>
  <div><em>domain&#8209;warped fbm</em></div>
</div>
<div class="plate bl">
  <div id="hms">00:00:00</div>
  <div id="date">&nbsp;</div>
</div>
<div class="plate br">
  <div>on view &mdash; continuous</div>
  <div class="hint">stir &middot; cursor&ensp;/&ensp;bloom &middot; tap</div>
</div>

<script>
(function(){
'use strict';

/* ---------------- clock ---------------- */
var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
var MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var hmsEl=document.getElementById('hms'), dateEl=document.getElementById('date');
function two(n){return n<10?'0'+n:''+n}
function tick(){
  var d=new Date();
  hmsEl.textContent=two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());
  dateEl.textContent=DAYS[d.getDay()]+' · '+two(d.getDate())+' '+MONS[d.getMonth()]+' '+d.getFullYear();
}
tick(); setInterval(tick,1000);

/* ---------------- title split ---------------- */
var h1=document.getElementById('title');
var txt=h1.textContent;
h1.setAttribute('aria-label',txt);
h1.textContent='';
for(var i=0;i<txt.length;i++){
  var s=document.createElement('span');
  s.className='ch'; s.textContent=txt[i];
  s.setAttribute('aria-hidden','true');
  s.style.animationDelay=(0.45+i*0.05)+'s';
  h1.appendChild(s);
}

/* ---------------- motion preference ---------------- */
var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
var reduced=mq.matches;
if(mq.addEventListener){mq.addEventListener('change',function(e){reduced=e.matches;});}

/* ---------------- webgl scene ---------------- */
var cv=document.getElementById('gl');

var VERT='attribute vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}';

var FRAG=[
'#ifdef GL_FRAGMENT_PRECISION_HIGH','precision highp float;','#else','precision mediump float;','#endif',
'uniform vec2 uRes;',
'uniform float uTime;',
'uniform vec2 uMouse;',
'uniform float uEnergy;',
'uniform float uReveal;',
'uniform vec3 uBurst;',
'float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.23);return fract(p.x*p.y);}',
'float noise(vec2 p){',
'  vec2 i=floor(p);vec2 f=fract(p);vec2 u=f*f*(3.0-2.0*f);',
'  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}',
'float fbm(vec2 p){',
'  float v=0.0;float a=0.5;mat2 R=mat2(0.8,0.6,-0.6,0.8);',
'  for(int i=0;i<4;i++){v+=a*noise(p);p=R*p*2.03;a*=0.55;}',
'  return v;}',
'void main(){',
'  vec2 uv=gl_FragCoord.xy/uRes;',
'  float mres=min(uRes.x,uRes.y);',
'  vec2 p=(gl_FragCoord.xy-0.5*uRes)/mres;',
'  float t=uTime;',
'  float ph=mod(t,47.0);',
'  float surge=exp(-((ph-40.0)*(ph-40.0))/7.0);',           // slow periodic swell
'  float rv=uReveal;',
'  vec2 pp=p*mix(1.35,1.0,rv);',                            // entrance: scene breathes open
'  float ts=t*0.05;',
'  vec2 q=vec2(fbm(pp*1.5+vec2(0.0,ts*1.2)),fbm(pp*1.5+vec2(5.2,1.3)-vec2(ts*0.9,ts*0.4)));',
'  vec2 mp=pp-uMouse;',
'  float md2=dot(mp,mp);',
'  float minf=exp(-md2*6.0);',
'  q+=uEnergy*minf*1.4*vec2(-mp.y,mp.x);',                  // cursor stirs the fluid
'  float age=t-uBurst.z;',
'  float ring=0.0;',
'  if(age>0.0&&age<6.0){',
'    vec2 bp=pp-uBurst.xy;',
'    float bd=length(bp);',
'    float rad=0.12+age*0.22;',
'    ring=exp(-age*0.75)*exp(-pow((bd-rad)*7.0,2.0));',
'    q+=ring*0.9*(bp/(bd+0.05));',                          // tap: expanding heat bloom
'  }',
'  float amp=2.3+1.0*surge;',
'  vec2 r=vec2(fbm(pp*1.5+amp*q+vec2(1.7,9.2)+vec2(ts*0.6,0.0)),fbm(pp*1.5+amp*q+vec2(8.3,2.8)-vec2(0.0,ts*0.5)));',
'  float f=fbm(pp*1.6+2.0*r);',
'  vec2 pw=pp+0.5*(r-vec2(0.45));',                         // molten blobs on warped coords
'  float B=0.0;vec2 c;',
'  c=vec2(sin(t*0.121)*0.55,cos(t*0.093)*0.42-0.05);      B+=0.032/(dot(pw-c,pw-c)+0.05);',
'  c=vec2(sin(t*0.071+2.1)*0.62,cos(t*0.111+1.4)*0.46);   B+=0.027/(dot(pw-c,pw-c)+0.045);',
'  c=vec2(sin(t*0.103+4.2)*0.48,cos(t*0.083+3.1)*0.52);   B+=0.030/(dot(pw-c,pw-c)+0.05);',
'  c=vec2(sin(t*0.087+1.0)*0.66,cos(t*0.131+5.2)*0.36);   B+=0.024/(dot(pw-c,pw-c)+0.04);',
'  B+=uEnergy*0.02/(md2+0.05);',
'  B*=0.7;',
'  float F=f*0.92+B*0.72+ring*0.6+uEnergy*0.25*minf;',
'  F*=mix(0.55,1.0,rv);',
'  vec3 col=vec3(0.045,0.038,0.058);',                      // charcoal ground
'  col=mix(col,vec3(0.16,0.05,0.11),smoothstep(0.18,0.45,F));',
'  col=mix(col,vec3(0.45,0.09,0.15),smoothstep(0.40,0.62,F));',
'  col=mix(col,vec3(0.93,0.32,0.14),smoothstep(0.58,0.82,F));',   // magma
'  col=mix(col,vec3(1.0,0.62,0.47),smoothstep(0.76,0.98,F));',    // rose heat
'  col=mix(col,vec3(1.0,0.87,0.63),smoothstep(0.92,1.18,F));',    // golden core
'  col+=vec3(0.20,0.10,0.42)*smoothstep(0.35,0.75,r.y)*(1.0-smoothstep(0.45,0.75,F))*0.55;', // violet sheen in shadow
'  col+=vec3(1.0,0.45,0.22)*0.14*smoothstep(0.7,1.1,F)*(1.0+1.6*surge);',
'  col+=vec3(1.0,0.8,0.5)*ring*0.35;',
'  vec2 vv=uv-0.5;',
'  col*=1.0-0.55*smoothstep(0.08,0.42,dot(vv,vv));',        // vignette
'  float g=hash(gl_FragCoord.xy+vec2(fract(t)*61.0,fract(t*1.3)*83.0));',
'  col+=(g-0.5)*0.045;',                                    // grain vs banding
'  col*=(0.25+0.75*rv);',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

function buildGL(){
  var gl;
  try{
    gl=cv.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'})
      ||cv.getContext('experimental-webgl',{alpha:false});
  }catch(e){return null;}
  if(!gl)return null;
  function sh(type,src){
    var s=gl.createShader(type);
    gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))return null;
    return s;
  }
  var vs=sh(gl.VERTEX_SHADER,VERT),fs=sh(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs)return null;
  var pr=gl.createProgram();
  gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;
  gl.useProgram(pr);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var aP=gl.getAttribLocation(pr,'aP');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  return {
    gl:gl,
    uRes:gl.getUniformLocation(pr,'uRes'),
    uTime:gl.getUniformLocation(pr,'uTime'),
    uMouse:gl.getUniformLocation(pr,'uMouse'),
    uEnergy:gl.getUniformLocation(pr,'uEnergy'),
    uReveal:gl.getUniformLocation(pr,'uReveal'),
    uBurst:gl.getUniformLocation(pr,'uBurst')
  };
}

var G=buildGL();
if(!G){
  document.documentElement.classList.add('no-gl');
  return; // clock + CSS fallback keep running
}
var gl=G.gl;

/* sizing: DPR-aware (cap 2), plus a total-pixel budget so 4K stays at 60fps */
var MAXPX=2.6e6;
function size(){
  var w=window.innerWidth,h=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(w*h*dpr*dpr>MAXPX)dpr=Math.sqrt(MAXPX/(w*h));
  var W=Math.max(1,Math.round(w*dpr)),H=Math.max(1,Math.round(h*dpr));
  if(cv.width!==W||cv.height!==H){
    cv.width=W;cv.height=H;
    gl.viewport(0,0,W,H);
  }
  gl.uniform2f(G.uRes,cv.width,cv.height);
}
size();
var rsT=0;
window.addEventListener('resize',function(){
  clearTimeout(rsT);
  rsT=setTimeout(function(){size();if(reduced)draw();},120);
});

/* ---------------- state ---------------- */
var sim=40.0;                 // start deep in the field, past the flat origin
var start=performance.now();
var mx=2.0,my=2.0,tx=2.0,ty=2.0;   // eased pointer (scene coords), begins offstage
var energy=0,etarget=0,pnx=0,pny=0;
var bx=0,by=0,bt=-100;        // burst pos + sim-time

function toScene(e){
  var w=window.innerWidth,h=window.innerHeight,m=Math.min(w,h);
  return [(e.clientX-w/2)/m,-(e.clientY-h/2)/m];
}
window.addEventListener('pointermove',function(e){
  var s=toScene(e);
  etarget=Math.min(1,etarget+Math.hypot(s[0]-pnx,s[1]-pny)*3.0);
  pnx=s[0];pny=s[1];tx=s[0];ty=s[1];
},{passive:true});
window.addEventListener('pointerdown',function(e){
  var s=toScene(e);
  tx=s[0];ty=s[1];
  if(!reduced){bx=s[0];by=s[1];bt=sim;}
},{passive:true});

/* entrance ignition: one automatic bloom near center */
setTimeout(function(){if(!reduced&&bt<-50){bx=0;by=-0.06;bt=sim;}},900);

function ease(x){return 1-Math.pow(1-x,3);}

/* ---------------- loop ---------------- */
var raf=0,running=false,last=0,fr=0;

function draw(){
  mx+=(tx-mx)*0.06;my+=(ty-my)*0.06;
  energy+=(etarget-energy)*0.06;etarget*=0.95;
  var rev=ease(Math.min(1,(performance.now()-start)/3800));
  gl.uniform1f(G.uTime,sim);
  gl.uniform2f(G.uMouse,mx,my);
  gl.uniform1f(G.uEnergy,reduced?0:energy);
  gl.uniform1f(G.uReveal,rev);
  gl.uniform3f(G.uBurst,bx,by,bt);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function loop(now){
  raf=requestAnimationFrame(loop);
  var dt=Math.min(now-last,100);last=now;
  sim+=dt*0.001*(reduced?0.06:1);
  fr++;
  if(reduced&&fr%6)return;   // calm slow variant at ~10fps
  draw();
}
function play(){
  if(running)return;
  running=true;last=performance.now();
  raf=requestAnimationFrame(loop);
}
function halt(){
  if(!running)return;
  running=false;cancelAnimationFrame(raf);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)halt();else play();
});
play();

})();
</script>
</body>
</html>
