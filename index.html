<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>serkankose77.me</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <script>
        (function () {
            const files = [
                "index1.html", "index2.html", "index3.html",
                "index4.html", "index5.html", "index6.html",
                "index7.html", "index8.html", "index9.html",
                "index10.html", "index11.html", "index12.html"
            ];

            // Avoid showing the same page twice in a row
            let last = null;
            try { last = localStorage.getItem("lastLanding"); } catch (e) { }

            const pool = files.filter(f => f !== last);
            const pick = pool[Math.floor(Math.random() * pool.length)];

            try { localStorage.setItem("lastLanding", pick); } catch (e) { }

            const iframe = document.createElement("iframe");
            iframe.src = pick;
            iframe.title = "serkankose77.me";
            iframe.allow = "autoplay";
            document.body.appendChild(iframe);
        })();
    </script>
</body>

</html>
