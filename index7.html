<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>serkankose77.me · NGC-77 Spiral Galaxy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Space+Mono&display=swap">
<style>
:root{
  --bg:#05030c;
  --gold:#ffd9a0;
  --ink:#f6f2ff;
  --dim:rgba(214,203,240,.5);
  --faint:rgba(214,203,240,.34);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:'Space Mono',ui-monospace,Menlo,'Courier New',monospace;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
body.flat{background:
  radial-gradient(ellipse 60% 38% at 50% 44%, #3d2c1e 0%, #16102a 45%, #05030c 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#gx{z-index:1}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(120% 92% at 50% 44%, transparent 44%, rgba(2,1,9,.4) 76%, rgba(1,0,6,.78) 100%)}
.grain{position:fixed;inset:-48px;z-index:6;pointer-events:none;opacity:.055;
  mix-blend-mode:overlay;animation:grain .9s steps(1,end) infinite}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none}

.ident{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
  width:100%;padding:0 4vw;text-align:center}
h1{
  margin:0;font-weight:400;text-transform:uppercase;
  font-family:'Julius Sans One','Trebuchet MS',Optima,'Gill Sans',sans-serif;
  font-size:clamp(1.35rem,4.2vw,4.6rem);
  letter-spacing:.34em;padding-left:.34em;
  color:var(--ink);
  animation:titleIn 2.8s cubic-bezier(.16,1,.3,1) .6s both;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  h1{
    background:linear-gradient(100deg,#f6f2ff 0%,#f6f2ff 42%,var(--gold) 50%,#f6f2ff 58%,#f6f2ff 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    animation:titleIn 2.8s cubic-bezier(.16,1,.3,1) .6s both,
              shimmer 11s linear 3.6s infinite;
  }
}
.rule{display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,2vw,22px);margin-top:clamp(10px,2vh,20px);
  animation:fadeUp 1.6s ease 2.5s both}
.rule i{display:block;height:1px;width:clamp(28px,6vw,88px);
  background:linear-gradient(90deg,transparent,rgba(255,217,160,.55))}
.rule i:last-child{transform:scaleX(-1)}
.rule p{margin:0;font-size:clamp(.55rem,1.05vw,.78rem);
  letter-spacing:.42em;text-indent:.42em;white-space:nowrap;
  text-transform:uppercase;color:rgba(235,225,255,.66)}

.clock{position:absolute;left:50%;bottom:clamp(18px,4.5vh,46px);
  transform:translateX(-50%);text-align:center;
  animation:fadeIn 1.8s ease 3.1s both}
#time{display:block;font-size:clamp(1.05rem,2.3vw,1.7rem);
  letter-spacing:.22em;text-indent:.22em;font-variant-numeric:tabular-nums;
  color:#efeafc;text-shadow:0 0 18px rgba(122,142,255,.28)}
#date{margin:.55em 0 0;font-size:clamp(.55rem,1vw,.72rem);
  letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--dim)}

.corner{position:absolute;font-size:clamp(.5rem,.85vw,.66rem);
  letter-spacing:.28em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;animation:fadeUp 1.8s ease 3.7s both}
.tl{top:clamp(14px,3vh,32px);left:clamp(16px,3vw,36px)}
.tr{top:clamp(14px,3vh,32px);right:clamp(16px,3vw,36px);text-align:right}
@media (max-width:680px){.tr{display:none}}

@keyframes titleIn{
  from{opacity:0;letter-spacing:.85em;filter:blur(16px)}
  to{opacity:1;letter-spacing:.34em;
     filter:blur(0) drop-shadow(0 0 26px rgba(255,206,130,.28)) drop-shadow(0 3px 14px rgba(0,0,0,.55))}
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:0% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes grain{
  0%{background-position:0 0}12%{background-position:-32px 26px}
  25%{background-position:44px -18px}37%{background-position:-14px -40px}
  50%{background-position:30px 34px}62%{background-position:-42px 6px}
  75%{background-position:16px -30px}87%{background-position:-24px 42px}
  100%{background-position:0 0}
}
@media (prefers-reduced-motion: reduce){
  h1,.rule,.clock,.corner{animation:none!important;opacity:1!important;transform:none}
  .clock{transform:translateX(-50%)}
  .ident{transform:translate(-50%,-50%)}
  h1{filter:drop-shadow(0 0 26px rgba(255,206,130,.28)) drop-shadow(0 3px 14px rgba(0,0,0,.55))}
  .grain{animation:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gx"></canvas>
<div class="vignette"></div>
<div class="ui">
  <div class="ident">
    <h1>serkankose77.me</h1>
    <div class="rule"><i></i><p>NGC-77 · Personal Cluster</p><i></i></div>
  </div>
  <div class="corner tl">R.A. 07ʰ 43ᵐ 07ˢ · Dec +77° 12′</div>
  <div class="corner tr">Type Sb · D 27.4 kpc</div>
  <div class="clock">
    <time id="time">00:00:00</time>
    <p id="date">—</p>
  </div>
</div>
<div class="grain"></div>
<script>
(function(){
'use strict';
var bgc=document.getElementById('bg'), fxc=document.getElementById('gx');
var b=bgc&&bgc.getContext('2d'), g=fxc&&fxc.getContext('2d');
if(!b||!g){document.body.classList.add('flat');startClock();return;}

var W=0,H=0,dpr=1,R=300;
var N=0,M=0;
var OM=0.05, SQ=0.55, TAU=Math.PI*2;
var rA,thA,omA,sqA,szA,alA,tpA,tsA,ciA;           /* stars */
var cR,cTh,cOm,cSz,cAl,cCi;                       /* gas clumps */
var novaPool=[], novae=[], nextNova=7;
var t=0,last=0,raf=0,running=false;
var tx=0,ty=0,px=0,py=0;
var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
var reduced=!!(mq&&mq.matches);

function rnd(){return Math.random();}
function gs(){return Math.random()+Math.random()+Math.random()-1.5;} /* ~N(0,.5) */

/* ---------- pre-rendered sprites ---------- */
var PAL=[[255,213,150],[255,232,200],[246,243,255],[201,220,255],[152,181,255],[177,148,242]];
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function radial(sz,stops){
  var c=document.createElement('canvas');c.width=c.height=sz;
  var x=c.getContext('2d');
  var gr=x.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  x.fillStyle=gr;x.fillRect(0,0,sz,sz);return c;
}
var STAR=[],CLUMP=[];
for(var pi=0;pi<PAL.length;pi++){
  var c=PAL[pi];
  STAR.push(radial(48,[[0,'rgba(255,255,255,.95)'],[.16,rgba(c,.85)],[.4,rgba(c,.3)],[1,rgba(c,0)]]));
  CLUMP.push(radial(96,[[0,rgba(c,.4)],[.45,rgba(c,.14)],[1,rgba(c,0)]]));
}
var coreBig=radial(256,[[0,'rgba(255,240,214,.85)'],[.2,'rgba(255,214,150,.5)'],[.5,'rgba(255,180,110,.16)'],[1,'rgba(255,160,90,0)']]);
var coreDot=radial(128,[[0,'rgba(255,252,244,1)'],[.3,'rgba(255,231,190,.85)'],[1,'rgba(255,210,150,0)']]);
var SPIKE=(function(){
  var c=document.createElement('canvas');c.width=c.height=160;
  var x=c.getContext('2d');
  var lg=x.createLinearGradient(0,0,160,0);
  lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,1)');lg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=lg;
  x.globalAlpha=.14;x.fillRect(0,76.5,160,7);
  x.globalAlpha=.32;x.fillRect(0,78.5,160,3);
  x.globalAlpha=.9; x.fillRect(0,79.3,160,1.4);
  x.translate(80,80);x.rotate(Math.PI/2);x.translate(-80,-80);
  x.globalAlpha=.14;x.fillRect(0,76.5,160,7);
  x.globalAlpha=.32;x.fillRect(0,78.5,160,3);
  x.globalAlpha=.9; x.fillRect(0,79.3,160,1.4);
  return c;
})();

/* ---------- galaxy generation ---------- */
function genStars(n){
  N=n;
  rA=new Float32Array(N);thA=new Float32Array(N);omA=new Float32Array(N);
  sqA=new Float32Array(N);szA=new Float32Array(N);alA=new Float32Array(N);
  tpA=new Float32Array(N);tsA=new Float32Array(N);ciA=new Uint8Array(N);
  novaPool.length=0;novae.length=0;
  for(var i=0;i<N;i++){
    var p=rnd(),rr,tt,qq,oo,ss,aa,cc;
    if(p<0.20){                                   /* bulge */
      var bx=gs()*0.16,by=gs()*0.13;
      rr=Math.sqrt(bx*bx+by*by)+0.004;tt=Math.atan2(by,bx);
      qq=0.85;oo=0.07;
      ss=0.7+rnd()*1.2;aa=0.45+rnd()*0.45;
      cc=rr<0.06?0:(rnd()<0.8?1:0);
    }else{
      rr=0.07+Math.pow(rnd(),1.35)*0.93;
      var field=p<0.34;
      if(field){
        tt=rnd()*TAU;aa=0.18+rnd()*0.35;ss=0.6+rnd()*1.3;
      }else{                                      /* two log-spiral arms */
        tt=(p<0.67?0:Math.PI)+3.4*Math.log(rr);
        var spread=0.055/(rr+0.1)+0.11;
        if(rnd()<0.3)spread*=2.2;
        tt+=gs()*spread;
        rr*=1+gs()*0.055;
        if(rr<0.05)rr=0.05;if(rr>1.05)rr=1.05;
        aa=0.3+rnd()*0.5;ss=0.7+rnd()*1.5;
      }
      qq=SQ;oo=OM/(0.22+rr);
      var crr=rr+gs()*0.05;
      cc=crr<0.15?0:crr<0.28?1:crr<0.5?(rnd()<0.5?2:3):crr<0.72?3:crr<0.88?4:5;
      if(rnd()<0.035){                            /* bright giants */
        ss=2.2+rnd()*1.9;aa=0.75+rnd()*0.25;
        cc=[1,3,4,5][(rnd()*4)|0];
      }
      if(!field&&rr>0.3&&rr<0.95)novaPool.push(i);
    }
    rA[i]=rr;thA[i]=tt;omA[i]=oo;sqA[i]=qq;szA[i]=ss;alA[i]=aa;ciA[i]=cc;
    tpA[i]=rnd()*TAU;tsA[i]=0.5+rnd()*2;
  }
  M=Math.round(N/55);                             /* soft gas clumps along arms */
  cR=new Float32Array(M);cTh=new Float32Array(M);cOm=new Float32Array(M);
  cSz=new Float32Array(M);cAl=new Float32Array(M);cCi=new Uint8Array(M);
  for(var j=0;j<M;j++){
    var jr=0.14+Math.pow(rnd(),0.85)*0.8;
    var jt=(rnd()<0.5?0:Math.PI)+3.4*Math.log(jr)+gs()*(0.05/(jr+0.1)+0.1);
    jr*=1+gs()*0.05;if(jr<0.08)jr=0.08;
    cR[j]=jr;cTh[j]=jt;cOm[j]=OM/(0.22+jr);
    cSz[j]=0.045+rnd()*0.11;
    cAl[j]=0.022+rnd()*0.045;
    cCi[j]=jr<0.3?1:jr<0.62?3:(rnd()<0.4?4:5);
  }
}

/* ---------- static deep background ---------- */
function drawBG(){
  b.setTransform(dpr,0,0,dpr,0,0);
  b.globalCompositeOperation='source-over';b.globalAlpha=1;
  b.fillStyle='#05030c';b.fillRect(0,0,W,H);
  var mx=Math.max(W,H);
  wash(0.18,0.2,mx*0.5,'rgba(41,26,74,0.16)');
  wash(0.85,0.75,mx*0.55,'rgba(18,30,64,0.14)');
  wash(0.6,0.1,mx*0.4,'rgba(58,22,66,0.10)');
  var n=(W*H/2400)|0,i;
  for(i=0;i<n;i++){
    var q=rnd();
    var col=q<0.7?'205,214,235':q<0.85?'255,226,192':'168,188,255';
    b.fillStyle='rgba('+col+','+(0.08+Math.pow(rnd(),2)*0.55).toFixed(3)+')';
    var s=rnd()<0.06?2:1;
    b.fillRect(rnd()*W,rnd()*H,s,s);
  }
  b.globalCompositeOperation='lighter';
  for(i=0;i<18;i++){                              /* a few haloed field stars */
    var hs=3.5+rnd()*4;
    b.globalAlpha=0.14+rnd()*0.2;
    b.drawImage(STAR[rnd()<0.6?3:1],rnd()*W-hs/2,rnd()*H-hs/2,hs,hs);
  }
  b.globalAlpha=1;
  smudge(W*0.14,H*0.72,0.9+rnd()*0.4,rnd()*Math.PI);
  smudge(W*0.86,H*0.18,0.7+rnd()*0.4,rnd()*Math.PI);
  b.globalCompositeOperation='source-over';
}
function wash(fx,fy,rad,col){
  var gr=b.createRadialGradient(W*fx,H*fy,0,W*fx,H*fy,rad);
  gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=gr;b.fillRect(0,0,W,H);
}
function smudge(x,y,sc,ang){                      /* tiny distant galaxy */
  var rad=30*sc;
  b.save();b.translate(x,y);b.rotate(ang);b.scale(1,0.38);
  var gr=b.createRadialGradient(0,0,0,0,0,rad);
  gr.addColorStop(0,'rgba(240,235,255,0.38)');
  gr.addColorStop(0.25,'rgba(190,180,230,0.16)');
  gr.addColorStop(1,'rgba(160,150,220,0)');
  b.fillStyle=gr;b.beginPath();b.arc(0,0,rad,0,TAU);b.fill();
  b.restore();
  b.fillStyle='rgba(255,244,225,0.7)';b.fillRect(x-0.5,y-0.5,1,1);
}

/* ---------- per-frame render ---------- */
function frame(){
  var ip=t/3.5;if(ip>1)ip=1;
  var intro=1-Math.pow(1-ip,3);
  var zoom=(1+0.22*(1-intro))*(1+0.035*Math.sin(t*0.07));
  var phi=-0.44+0.05*Math.sin(t*0.021);
  var cp=Math.cos(phi),sp=Math.sin(phi);
  px+=(tx*18-px)*0.05;py+=(ty*12-py)*0.05;
  var cx=W/2+Math.sin(t*0.041)*0.012*R+px;
  var cy=H*0.44+Math.cos(t*0.033)*0.009*R+py;
  var zr=R*zoom;
  var sizeS=Math.min(2.3,Math.max(0.75,R/520))*zoom;
  var i,ang,x,y,X,Y,sx,sy,s,a;

  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,W,H);
  g.globalCompositeOperation='lighter';

  for(i=0;i<M;i++){                               /* gas clumps */
    ang=cTh[i]+cOm[i]*t;
    x=Math.cos(ang)*cR[i];y=Math.sin(ang)*cR[i]*SQ;
    X=x*cp-y*sp;Y=x*sp+y*cp;
    sx=cx+X*zr;sy=cy+Y*zr;
    s=cSz[i]*zr*2;
    g.globalAlpha=cAl[i]*intro;
    g.drawImage(CLUMP[cCi[i]],sx-s/2,sy-s/2,s,s);
  }

  var pulse=1+0.05*Math.sin(t*0.8);               /* core bloom */
  g.save();g.translate(cx,cy);g.rotate(phi);g.scale(1,0.66);
  g.globalAlpha=0.5*intro*pulse;s=zr*1.3;g.drawImage(coreBig,-s/2,-s/2,s,s);
  g.globalAlpha=0.75*intro;s=zr*0.5;g.drawImage(coreBig,-s/2,-s/2,s,s);
  g.globalAlpha=0.95*intro;s=zr*0.16*pulse;g.drawImage(coreDot,-s/2,-s/2,s,s);
  g.restore();

  for(i=0;i<N;i++){                               /* stars */
    ang=thA[i]+omA[i]*t;
    x=Math.cos(ang)*rA[i];y=Math.sin(ang)*rA[i]*sqA[i];
    X=x*cp-y*sp;Y=x*sp+y*cp;
    sx=cx+X*zr;sy=cy+Y*zr;
    if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    a=alA[i]*(0.78+0.22*Math.sin(t*tsA[i]+tpA[i]))*intro;
    if(Y<0)a*=0.9;                                /* far side of the tilt */
    s=szA[i]*sizeS*3;
    g.globalAlpha=a;
    g.drawImage(STAR[ciA[i]],sx-s/2,sy-s/2,s,s);
  }

  if(t>nextNova&&novaPool.length&&!reduced){      /* supernova scheduler */
    novae.push({i:novaPool[(rnd()*novaPool.length)|0],s:t});
    nextNova=t+5+rnd()*8;
  }
  for(var k=novae.length-1;k>=0;k--){
    var nv=novae[k],e=(t-nv.s)/3.2;
    if(e>=1){novae.splice(k,1);continue;}
    var bb=e<0.07?e/0.07:Math.pow(1-(e-0.07)/0.93,1.7);
    i=nv.i;
    ang=thA[i]+omA[i]*t;
    x=Math.cos(ang)*rA[i];y=Math.sin(ang)*rA[i]*sqA[i];
    X=x*cp-y*sp;Y=x*sp+y*cp;
    sx=cx+X*zr;sy=cy+Y*zr;
    s=(16+72*bb)*sizeS;
    g.globalAlpha=Math.min(1,bb*0.95);
    g.drawImage(STAR[2],sx-s/2,sy-s/2,s,s);
    s*=2.7;
    g.globalAlpha=Math.pow(bb,1.5)*0.85;
    g.drawImage(SPIKE,sx-s/2,sy-s/2,s,s);
  }
  g.globalAlpha=1;
}

/* ---------- loop / lifecycle ---------- */
function loop(now){
  raf=requestAnimationFrame(loop);
  var dt=(now-last)/1000;last=now;
  if(dt<0)dt=0;if(dt>0.25)dt=0.25;
  t+=dt;
  frame();
}
function start(){
  if(reduced){t=6;frame();return;}
  if(running||document.hidden)return;
  running=true;last=performance.now();
  raf=requestAnimationFrame(loop);
}
function stop(){
  running=false;cancelAnimationFrame(raf);
}

function setup(){
  W=window.innerWidth;H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  bgc.width=W*dpr;bgc.height=H*dpr;
  fxc.width=W*dpr;fxc.height=H*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  R=Math.max(210,Math.min(Math.min(W,H)*0.62,Math.max(W,H)*0.34));
  var targetN=Math.round(Math.min(6000,Math.max(1500,W*H/280)));
  if(!N||Math.abs(targetN-N)/N>0.2)genStars(targetN);
  drawBG();
  if(reduced){t=6;frame();}
}

var rto=0;
window.addEventListener('resize',function(){
  clearTimeout(rto);rto=setTimeout(setup,160);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)stop();else start();
});
window.addEventListener('pointermove',function(e){
  if(reduced)return;
  tx=e.clientX/W-0.5;ty=e.clientY/H-0.5;
});
if(mq){
  var onmq=function(){
    reduced=mq.matches;
    if(reduced){stop();px=py=tx=ty=0;t=6;frame();}
    else start();
  };
  if(mq.addEventListener)mq.addEventListener('change',onmq);
  else if(mq.addListener)mq.addListener(onmq);
}

/* ---------- film grain tile ---------- */
try{
  var gc=document.createElement('canvas');gc.width=gc.height=128;
  var gg=gc.getContext('2d');
  var im=gg.createImageData(128,128),d=im.data;
  for(var n=0;n<d.length;n+=4){
    var v=(Math.random()*255)|0;
    d[n]=v;d[n+1]=v;d[n+2]=v;d[n+3]=26;
  }
  gg.putImageData(im,0,0);
  document.querySelector('.grain').style.backgroundImage='url('+gc.toDataURL()+')';
}catch(e){}

/* ---------- clock ---------- */
function startClock(){
  var DAYS=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  var MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var te=document.getElementById('time'),de=document.getElementById('date');
  function pad(x){return x<10?'0'+x:''+x;}
  function tick(){
    var d=new Date();
    te.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    de.textContent=DAYS[d.getDay()]+' · '+pad(d.getDate())+' '+MONS[d.getMonth()]+' '+d.getFullYear();
    setTimeout(tick,1020-(Date.now()%1000));
  }
  tick();
}

setup();
startClock();
start();
})();
</script>
</body>
</html>
